<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ApexPOS — Restaurant Management</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

<!-- ══════════ GLOBAL VIDEO BACKGROUND ══════════ -->
<div class="video-bg" id="videoBg">
  <video autoplay muted loop playsinline id="bgVideo">
    <source src="https://motionbgs.com/media/5296/orange-train-at-sunset.960x540.mp4" type="video/mp4" />
  </video>
  <div class="video-bg-overlay"></div>
</div>

<!-- ══════════ LOGIN ══════════ -->
<div class="login-screen" id="loginScreen">
  <div class="login-bg"><div class="login-bg-shape s1"></div><div class="login-bg-shape s2"></div><div class="login-bg-shape s3"></div></div>
  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-icon"><svg width="36" height="36" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="8" fill="currentColor"/><path d="M8 20V8h4l3 6 3-6h4v12h-3.5v-7.5L16 16.5l-3.5-4V20H8z" fill="#fff"/></svg></div>
      <h1 class="login-title">ApexPOS</h1>
      <p class="login-subtitle">Restaurant Management System</p>
    </div>
    <div class="login-tabs">
      <button class="login-tab active" data-role="customer" onclick="switchLoginTab('customer')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Customer</button>
      <button class="login-tab" data-role="staff" onclick="switchLoginTab('staff')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a4 4 0 0 0-8 0v2"/></svg> Staff</button>
      <button class="login-tab" data-role="admin" onclick="switchLoginTab('admin')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg> Admin</button>
    </div>
    <form class="login-form" id="customerForm" onsubmit="handleLogin(event,'customer')">
      <div class="form-group"><label>Your Name</label><div class="input-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><input type="text" id="customerName" placeholder="Enter your name" required autocomplete="off"/></div></div>
      <button type="submit" class="btn-login">Continue as Customer <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
    </form>
    <form class="login-form" id="staffForm" style="display:none;" onsubmit="handleLogin(event,'staff')">
      <div class="form-group"><label>Staff Email</label><div class="input-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg><input type="text" id="staffEmail" placeholder="letters only (e.g. john@store)" required autocomplete="off"/></div><span class="input-hint">Only letters, @ and . allowed</span></div>
      <div class="form-group"><label>Password</label><div class="input-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="staffPassword" placeholder="Enter password" required/></div></div>
      <button type="submit" class="btn-login">Sign In as Staff <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
    </form>
    <form class="login-form" id="adminForm" style="display:none;" onsubmit="handleLogin(event,'admin')">
      <div class="form-group"><label>Admin Email</label><div class="input-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg><input type="text" id="adminEmail" placeholder="Admin123" required autocomplete="off"/></div></div>
      <div class="form-group"><label>Password</label><div class="input-wrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" id="adminPassword" placeholder="Admin123" required/></div></div>
      <button type="submit" class="btn-login">Sign In as Admin <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
    </form>
    <div class="login-hint"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg> Admin credentials: Admin123 / Admin123</div>
  </div>
</div>

<!-- ══════════ ADMIN LAYOUT ══════════ -->
<div class="admin-layout" id="adminLayout" style="display:none;">
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="sidebar-brand"><svg width="24" height="24" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="8" fill="currentColor"/><path d="M8 20V8h4l3 6 3-6h4v12h-3.5v-7.5L16 16.5l-3.5-4V20H8z" fill="#fff"/></svg><span>ApexPOS</span></div>
    <nav class="sidebar-nav" id="sidebarNav">
      <button class="sidebar-link active" data-page="dashboard" onclick="goTo('dashboard')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</button>
      <button class="sidebar-link" data-page="neworder" onclick="goTo('neworder')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>New Order</button>
      <button class="sidebar-link" data-page="orders" onclick="goTo('orders')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Orders</button>
      <button class="sidebar-link" data-page="tables" onclick="goTo('tables')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="4" rx="1"/><path d="M4 11v8M20 11v8M8 11v8M16 11v8"/></svg>Table Map</button>
      <button class="sidebar-link" data-page="menu" onclick="goTo('menu')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg>Menu Items</button>
      <button class="sidebar-link" data-page="customers" onclick="goTo('customers')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Customers</button>
      <button class="sidebar-link" data-page="staff" onclick="goTo('staff')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Staff</button>
      <button class="sidebar-link" data-page="inventory" onclick="goTo('inventory')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>Inventory</button>
      <button class="sidebar-link" data-page="expenses" onclick="goTo('expenses')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Expenses</button>
      <button class="sidebar-link" data-page="reports" onclick="goTo('reports')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Reports</button>
      <button class="sidebar-link" data-page="settings" onclick="goTo('settings')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Settings</button>
    </nav>
    <div class="sidebar-footer"><button class="sidebar-logout" onclick="handleLogout()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Logout</button></div>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <div class="admin-header-left">
        <button class="sidebar-toggle" onclick="toggleSidebar()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <h2 class="admin-page-title" id="pageTitle">Dashboard</h2>
      </div>
      <div class="admin-header-right">
        <span class="admin-clock" id="adminClock"></span>
        <button class="icon-btn" onclick="toggleTheme()"><svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg><svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
        <div class="admin-profile"><div class="avatar avatar--admin">AD</div><span id="adminDisplayName">Admin</span></div>
      </div>
    </header>

    <div class="admin-content" id="adminContent">
      <!-- ═══ 01 DASHBOARD ═══ -->
      <section class="admin-page active" id="pg-dashboard"></section>
      <!-- ═══ 02 NEW ORDER ═══ -->
      <section class="admin-page" id="pg-neworder"></section>
      <!-- ═══ 03 ORDERS ═══ -->
      <section class="admin-page" id="pg-orders"></section>
      <!-- ═══ 04 TABLE MAP ═══ -->
      <section class="admin-page" id="pg-tables"></section>
      <!-- ═══ 05 MENU ITEMS ═══ -->
      <section class="admin-page" id="pg-menu"></section>
      <!-- ═══ 06 CUSTOMERS ═══ -->
      <section class="admin-page" id="pg-customers"></section>
      <!-- ═══ 07 STAFF ═══ -->
      <section class="admin-page" id="pg-staff"></section>
      <!-- ═══ 08 INVENTORY ═══ -->
      <section class="admin-page" id="pg-inventory"></section>
      <!-- ═══ 09 EXPENSES ═══ -->
      <section class="admin-page" id="pg-expenses"></section>
      <!-- ═══ 10 REPORTS ═══ -->
      <section class="admin-page" id="pg-reports"></section>
      <!-- ═══ 11 SETTINGS ═══ -->
      <section class="admin-page" id="pg-settings"></section>
    </div>
  </main>
</div>

<!-- ══════════ MODALS ══════════ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal modal--sm" id="modalContainer"></div>
</div>

<!-- TOAST -->
<div class="toast-container" id="toastContainer"></div>

<!-- ══════════ CUSTOMER POS ══════════ -->
<div class="pos-wrapper" id="posWrapper" style="display:none;">
  <header class="header">
    <div class="header__left">
      <div class="header__brand"><div class="brand-icon"><svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="8" fill="currentColor"/><path d="M8 20V8h4l3 6 3-6h4v12h-3.5v-7.5L16 16.5l-3.5-4V20H8z" fill="var(--bg-primary)"/></svg></div><span class="brand-name">ApexPOS</span></div>
    </div>
    <div class="header__center"><div class="search-bar"><svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input type="text" id="posSearch" placeholder="Search menu..." autocomplete="off" oninput="filterPosMenu()"/></div></div>
    <div class="header__right">
      <span class="clock" id="clock"></span>
      <button class="icon-btn" onclick="toggleTheme()"><svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg><svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
      <div class="cashier-profile"><div class="avatar" id="posAvatar">CU</div><span class="cashier-name" id="posUsername">Customer</span></div>
      <button class="btn-outline btn-sm" onclick="handleLogout()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
    </div>
  </header>
  <main class="pos-layout">
    <section class="product-panel"><div class="product-grid" id="posGrid"></div></section>
    <aside class="cart-panel">
      <div class="cart-header"><div class="cart-title-row"><h2 class="cart-title">Order</h2><span class="cart-badge" id="cartBadge">0</span></div><button class="btn-clear" onclick="clearCart()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div>
      <div class="cart-items" id="cartItems"><div class="cart-empty" id="cartEmpty"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><p>No items</p><span>Click menu items to add</span></div></div>
      <div class="cart-summary" id="cartSummary" style="display:none;">
        <div class="summary-row"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
        <div class="summary-row discount" id="discountRow" style="display:none;"><span>Discount</span><span id="discountAmt">-$0.00</span></div>
        <div class="summary-row"><span>Tax (8.5%)</span><span id="taxAmt">$0.00</span></div>
        <div class="summary-divider"></div>
        <div class="summary-row total"><span>Total</span><span id="totalAmt">$0.00</span></div>
        <div class="discount-input-row"><input type="text" id="discountInput" placeholder="Discount % or $"/><button class="btn-apply" onclick="applyDiscount()">Apply</button></div>
        <div class="cart-actions">
          <button class="btn-hold" onclick="holdOrder()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>Hold</button>
          <button class="btn-pay" onclick="openPayModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/></svg>Pay Now</button>
        </div>
      </div>
    </aside>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
